version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: apidb
      MYSQL_USER: apiuser
      MYSQL_PASSWORD: apipassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "apiuser", "-papipassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_app
    restart: on-failure
    environment:
      DB_HOST: mysql
      DB_USER: apiuser
      DB_PASSWORD: apipassword
      DB_NAME: apidb
      MODEL_PATH: /app/model.pkl
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "python train.py &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_tests
    environment:
      DB_HOST: mysql
      DB_USER: apiuser
      DB_PASSWORD: apipassword
      DB_NAME: apidb
      MODEL_PATH: /app/model.pkl
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    command: >
      sh -c "python train.py &&
             pytest test/test_main.py -v"
    profiles:
      - test

volumes:
  mysql_data:
